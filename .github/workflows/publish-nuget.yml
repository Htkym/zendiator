# Release (tag-triggered): builds, tests and packs the tagged commit, then publishes
# the already-verified artifacts to NuGet.org. No rebuild happens before push.
# Push a tag like v0.1.0 to run this workflow.
#
# External preparation (once, outside this workflow):
# - Confirm ownership/publishing authorization for `Zendiator`,
#   `Zendiator.Abstractions` and `Zendiator.CodeFixes`.
# - On nuget.org, add a Trusted Publishing policy for this repo:
#   Repository Owner: Htkym, Repository: zendiator, Workflow File: publish-nuget.yml
#   (this file name only; the policy compares the file name, not the full path).
# - No long-lived API key is stored; NuGet/login exchanges the job OIDC token
#   for a short-lived key valid for about 1 hour. Keep login close to push.
# See https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
name: Release

on:
  push:
    tags:
      - "v*"

env:
  RELEASE_TAG: ${{ github.ref_name }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  build-and-pack:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source-commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Validate tag format
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch "^v\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$") {
            throw "tag must look like v<version>, e.g. v0.1.0-preview.1"
          }

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Verify release tag equals current reviewed main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Test-MainRelease.ps1 -CiWorkflow ci.yml -ReleaseTag $env:RELEASE_TAG -RequireTag

      - name: Version matches tag
        id: source
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Directory.Build.props Version ($version) does not match tag ($env:RELEASE_TAG)"
          }
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Zendiator.slnx

      - name: Build
        run: dotnet build Zendiator.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Zendiator.slnx -c Release --no-build

      - name: Validate use-case benchmark fixtures
        working-directory: benchmarks/Zendiator.UseCaseBenchmarks
        run: dotnet ./bin/Release/net10.0/Zendiator.UseCaseBenchmarks.dll --validate-only

      - name: Pack
        run: |
          dotnet pack src/Zendiator.Abstractions/Zendiator.Abstractions.csproj -c Release --no-build -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Zendiator/Zendiator.csproj -c Release --no-build -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Zendiator.CodeFixes/Zendiator.CodeFixes.csproj -c Release --no-build -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify package contents and freeze checksums
        shell: pwsh
        run: ./scripts/Verify-ReleasePackages.ps1 -SourceCommit '${{ steps.source.outputs.commit }}'

      - name: Verify the frozen packages with consumers and Native AOT
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          ./scripts/package-smoke-test.ps1 -PackageVersion $version -PackagesDir artifacts/packages
          ./scripts/di-package-smoke-test.ps1 -PackageVersion $version -PackagesDir artifacts/packages
          ./scripts/aot-matrix-test.ps1 -PackageVersion $version -PackagesDir artifacts/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content artifacts/packages/manifest.json -Raw | ConvertFrom-Json
          $manifest.Verification = [ordered]@{ Consumer = 'Passed'; DI = 'Passed'; AOT = 'AOT01-AOT12 win-x64 passed; open-generic value-type closure LIMIT' }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content artifacts/packages/manifest.json

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/manifest.json
          if-no-files-found: error

  publish:
    runs-on: windows-latest
    needs: build-and-pack
    permissions:
      contents: read
      actions: read
      id-token: write # Required for the GitHub OIDC token used by NuGet/login.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release tag equals current reviewed main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Test-MainRelease.ps1 -CiWorkflow ci.yml -ReleaseTag $env:RELEASE_TAG -RequireTag
      - name: Download verified artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Match downloaded packages to the verified manifest
        shell: pwsh
        run: |
          $manifest = Get-Content artifacts/packages/manifest.json -Raw | ConvertFrom-Json
          if ("v$($manifest.Version)" -ne $env:RELEASE_TAG -or $manifest.SourceCommit -ne '${{ needs.build-and-pack.outputs.source-commit }}') {
            throw 'Manifest version/source mismatch'
          }
          if ($manifest.Verification.Consumer -ne 'Passed' -or $manifest.Verification.DI -ne 'Passed' -or $manifest.Verification.AOT -notlike 'AOT01-AOT12 win-x64 passed;*') {
            throw 'Manifest consumer verification missing'
          }
          $expected = foreach ($id in @('Zendiator.Abstractions', 'Zendiator', 'Zendiator.CodeFixes')) {
            $extensions = if ($id -eq 'Zendiator.CodeFixes') { @('nupkg') } else { @('nupkg', 'snupkg') }
            foreach ($extension in $extensions) { "$id.$($manifest.Version).$extension" }
          }
          if ($manifest.Files.Count -ne 5 -or (Compare-Object ($manifest.Files.Name | Sort-Object) ($expected | Sort-Object))) {
            throw 'Manifest package set mismatch'
          }
          foreach ($entry in $manifest.Files) {
            $file = Get-Item "artifacts/packages/$($entry.Name)"
            if ($file.Length -ne $entry.Size -or (Get-FileHash $file.FullName -Algorithm SHA256).Hash -ne $entry.SHA256) {
              throw "Package checksum mismatch: $($entry.Name)"
            }
          }

      # Short-lived key; request it immediately before push (valid ~1 hour,
      # one token yields one key). `user` is the nuget.org profile name.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages with symbols
        shell: pwsh
        run: |
          # Pushing a .nupkg also pushes the adjacent .snupkg to the symbol server.
          $version = $env:RELEASE_TAG.TrimStart('v')
          dotnet nuget push "artifacts/packages/Zendiator.Abstractions.$version.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet nuget push "artifacts/packages/Zendiator.$version.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet nuget push "artifacts/packages/Zendiator.CodeFixes.$version.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
