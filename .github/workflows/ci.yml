name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            10.0.403
            10.0.x

      - name: Record validation environment
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID (attempt $env:GITHUB_RUN_ATTEMPT)" >> $env:GITHUB_STEP_SUMMARY
          "Runner: $env:RUNNER_OS / $env:RUNNER_ARCH" >> $env:GITHUB_STEP_SUMMARY
          dotnet --info
          "SDK: $(dotnet --version)" >> $env:GITHUB_STEP_SUMMARY
          dotnet --list-runtimes

      - name: Restore
        run: dotnet restore Zendiator.slnx

      - name: Restore supplemental benchmark fixtures
        shell: pwsh
        run: |
          foreach ($name in 'HPeerComparison', 'ShortCircuitComparison', 'FoundatioReleaseComparison') {
            dotnet restore "benchmarks/$name/$name.csproj" --locked-mode -p:ZendiatorFormalMeasurement=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify tracked package locks
        shell: pwsh
        run: |
          $locks = @(
            'benchmarks/Zendiator.UseCaseBenchmarks/packages.lock.json'
            'benchmarks/Zendiator.BeforeRelayBenchmarks/packages.lock.json'
            'benchmarks/HPeerComparison/packages.lock.json'
            'benchmarks/ShortCircuitComparison/packages.lock.json'
            'benchmarks/FoundatioReleaseComparison/packages.lock.json'
          )
          git diff --exit-code -- $locks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: dotnet build Zendiator.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Zendiator.slnx -c Release --no-build

      - name: Validate use-case benchmark fixtures
        working-directory: benchmarks/Zendiator.UseCaseBenchmarks
        shell: pwsh
        run: |
          dotnet ./bin/Release/net10.0/Zendiator.UseCaseBenchmarks.dll --validate-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = Join-Path $env:RUNNER_TEMP ('zendiator-struct-gate-' + [Guid]::NewGuid().ToString('N'))
          dotnet ./bin/Release/net10.0/Zendiator.UseCaseBenchmarks.dll --validate-struct-upstream $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and validate supplemental benchmark fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'HPeerComparison', 'ShortCircuitComparison', 'FoundatioReleaseComparison') {
            dotnet build "benchmarks/$name/$name.csproj" -c Release --no-restore -p:ZendiatorFormalMeasurement=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:COLD_RUN = Join-Path $env:RUNNER_TEMP ("zendiator-semantic-$name-" + [Guid]::NewGuid().ToString('N'))
            Push-Location "benchmarks/$name"
            try {
              dotnet "./bin/Release/net10.0/$name.dll" --validate-only
              if ($LASTEXITCODE -ne 0) { throw "Supplemental semantic gate failed: $name" }
            } finally {
              Pop-Location
            }
          }

      - name: Run Stream Before example
        working-directory: benchmarks/Zendiator.BeforeRelayBenchmarks
        run: dotnet ./bin/Release/net10.0/Zendiator.BeforeRelayBenchmarks.dll --example

      - name: Pack
        run: |
          dotnet pack src/Zendiator.Abstractions/Zendiator.Abstractions.csproj -c Release --no-build -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Zendiator/Zendiator.csproj -c Release --no-build -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Zendiator.CodeFixes/Zendiator.CodeFixes.csproj -c Release --no-build -o artifacts/packages

      - name: Restore remaining project dependencies for formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$solution = Get-Content 'Zendiator.slnx' -Raw
          $solutionProjects = @($solution.SelectNodes('//Project') | ForEach-Object { $_.Path })
          $projects = @(git ls-files -- '*.csproj')
          if ($LASTEXITCODE -ne 0) { throw 'Project enumeration failed' }
          $feed = (Resolve-Path artifacts/packages).Path
          $packages = Join-Path $env:RUNNER_TEMP 'format-consumer-packages'
          $config = Join-Path $env:RUNNER_TEMP 'format.NuGet.Config'
          $escapedFeed = [System.Security.SecurityElement]::Escape($feed)
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$escapedFeed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Set-Content $config -Encoding UTF8
          foreach ($project in $projects | Where-Object { $_ -notin $solutionProjects }) {
            [xml]$xml = Get-Content $project -Raw
            $consumesPackage = @($xml.SelectNodes('//PackageReference') | Where-Object { $_.Include -eq 'Zendiator' }).Count -gt 0
            if ($consumesPackage) {
              dotnet restore $project --packages $packages --configfile $config
            } else {
              dotnet restore $project
            }
            if ($LASTEXITCODE -ne 0) { throw "Additional project restore failed: $project" }
          }

      - name: Format check
        shell: pwsh
        run: |
          $projects = @(git ls-files -- '*.csproj')
          if ($LASTEXITCODE -ne 0 -or $projects.Count -eq 0) { throw 'No tracked C# projects found' }
          foreach ($project in $projects) {
            dotnet format $project --verify-no-changes --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify package contents
        shell: pwsh
        run: |
          $sourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Verify-ReleasePackages.ps1 -SourceCommit $sourceCommit

      - name: Run sample
        run: dotnet run --project samples/Zendiator.Sample.Host -c Release --no-build

      - name: Package smoke test (isolated feed, no ProjectReference)
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          ./scripts/package-smoke-test.ps1 -PackageVersion $version -PackagesDir artifacts/packages
          ./scripts/di-package-smoke-test.ps1 -PackageVersion $version -PackagesDir artifacts/packages

      # Native AOT against the packed packages (the supported AOT path).
      # The in-repo sample uses ProjectReference for the dev loop and is not AOT-published.
      - name: Native AOT publish and run (package-based sample)
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          ./scripts/aot-matrix-test.ps1 -PackageVersion $version -PackagesDir artifacts/packages

      - name: Pooled producer package and Native AOT smoke (C# 14)
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          ./scripts/pooled-producer-package-smoke-test.ps1 -PackageVersion $version -PackagesDir artifacts/packages -Aot

      - name: Typed Stream standard contract package and Native AOT smoke
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          ./scripts/struct-upstream-package-smoke-test.ps1 -PackageVersion $version -PackagesDir artifacts/packages -WorkingDir (Join-Path $env:RUNNER_TEMP 'standard-stream-smoke') -Aot

      - name: Record validation outcome
        if: always()
        shell: pwsh
        env:
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          "Validation: $env:VALIDATION_STATUS" >> $env:GITHUB_STEP_SUMMARY
          "Individual results and failures: see this run's step logs. Strict performance measurement and package publication are not part of this workflow." >> $env:GITHUB_STEP_SUMMARY
