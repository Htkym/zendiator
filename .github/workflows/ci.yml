name: CI

on:
  push:
    branches: [main, feature/0.5.0]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Zendiator.slnx

      - name: Build
        run: dotnet build Zendiator.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Zendiator.slnx -c Release --no-build

      - name: Validate use-case benchmark fixtures
        working-directory: benchmarks/Zendiator.UseCaseBenchmarks
        run: dotnet ./bin/Release/net10.0/Zendiator.UseCaseBenchmarks.dll --validate-only

      - name: Format check
        shell: pwsh
        run: |
          foreach ($p in @(
            "src/Zendiator.Abstractions/Zendiator.Abstractions.csproj",
            "src/Zendiator/Zendiator.csproj",
            "src/Zendiator.SourceGenerator/Zendiator.SourceGenerator.csproj",
            "tests/Zendiator.Tests/Zendiator.Tests.csproj",
            "tests/Zendiator.AssemblyGen.Tests/Zendiator.AssemblyGen.Tests.csproj",
            "tests/Zendiator.Configuration.Tests/Zendiator.Configuration.Tests.csproj",
            "tests/Zendiator.DiConfiguration.Tests/Zendiator.DiConfiguration.Tests.csproj",
            "tests/Zendiator.Generator.Tests/Zendiator.Generator.Tests.csproj",
            "tests/Zendiator.Allocation.Tests/Zendiator.Allocation.Tests.csproj",
            "tests/Zendiator.CachePolicy.Tests/Zendiator.CachePolicy.Tests.csproj",
            "samples/Zendiator.Sample.Contracts/Zendiator.Sample.Contracts.csproj",
            "samples/Zendiator.Sample.Application/Zendiator.Sample.Application.csproj",
            "samples/Zendiator.Sample.Host/Zendiator.Sample.Host.csproj",
            "benchmarks/Zendiator.UseCaseBenchmarks/Zendiator.UseCaseBenchmarks.csproj")) {
            dotnet format $p --verify-no-changes --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Pack
        run: |
          dotnet pack src/Zendiator.Abstractions/Zendiator.Abstractions.csproj -c Release --no-build -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Zendiator/Zendiator.csproj -c Release --no-build -o artifacts/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Zendiator.CodeFixes/Zendiator.CodeFixes.csproj -c Release --no-build -o artifacts/packages

      - name: Verify package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $tmp = Join-Path $env:RUNNER_TEMP "pkg-inspect"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          Expand-Archive "artifacts/packages/Zendiator.$version.nupkg" "$tmp/main" -Force
          $analyzer = "$tmp/main/analyzers/dotnet/cs/Zendiator.SourceGenerator.dll"
          if (-not (Test-Path $analyzer)) { throw "generator analyzer missing from package" }
          $nuspec = Get-Content "$tmp/main/Zendiator.nuspec" -Raw
          foreach ($banned in @("MessagePipe", "CodeAnalysis", "Zendiator.CodeFixes")) {
            if ($nuspec -match $banned) { throw "banned dependency in nuspec: $banned" }
          }
          if ($nuspec -notmatch 'dependency id="Zendiator.Abstractions"') { throw "Abstractions dependency missing" }
          if (Get-ChildItem "$tmp/main" -Filter Zendiator.CodeFixes.dll -Recurse) { throw "optional CodeFix assembly bundled in main package" }

          Expand-Archive "artifacts/packages/Zendiator.CodeFixes.$version.nupkg" "$tmp/codefix" -Force
          $codeFixAssembly = [IO.Path]::GetFullPath("$tmp/codefix/analyzers/dotnet/cs/Zendiator.CodeFixes.dll")
          $codeFixDlls = @(Get-ChildItem "$tmp/codefix" -Filter *.dll -Recurse)
          if ($codeFixDlls.Count -ne 1 -or $codeFixDlls[0].FullName -ne $codeFixAssembly) { throw "CodeFix package must contain only its C# analyzer assembly" }
          if ((Test-Path "$tmp/codefix/lib") -or (Test-Path "$tmp/codefix/runtimes")) { throw "runtime assets in optional CodeFix package" }
          [xml]$codeFixNuspec = Get-Content "$tmp/codefix/Zendiator.CodeFixes.nuspec" -Raw
          if ($codeFixNuspec.SelectNodes("//*[local-name()='dependency']").Count -ne 0) { throw "dependencies in optional CodeFix package" }
          if ($codeFixNuspec.package.metadata.developmentDependency -ne "true") { throw "CodeFix developmentDependency missing" }
          if ($codeFixNuspec.package.metadata.readme -ne "README.md") { throw "CodeFix package readme metadata missing" }
          $sourceReadme = (Get-FileHash "src/Zendiator.CodeFixes/README.md" -Algorithm SHA256).Hash
          $packedReadme = (Get-FileHash "$tmp/codefix/README.md" -Algorithm SHA256).Hash
          if ($sourceReadme -ne $packedReadme) { throw "CodeFix package readme differs from source" }

      - name: Run sample
        run: dotnet run --project samples/Zendiator.Sample.Host -c Release --no-build

      - name: Package smoke test (isolated feed, no ProjectReference)
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          ./scripts/package-smoke-test.ps1 -PackageVersion $version -PackagesDir artifacts/packages
          ./scripts/di-package-smoke-test.ps1 -PackageVersion $version -PackagesDir artifacts/packages

      # Native AOT against the packed packages (the supported AOT path).
      # The in-repo sample uses ProjectReference for the dev loop and is not AOT-published.
      - name: Native AOT publish and run (package-based sample)
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          ./scripts/aot-matrix-test.ps1 -PackageVersion $version -PackagesDir artifacts/packages
